version: '3.8'

services:
  # Build environment for creating RPM packages
  builder:
    build: .
    container_name: otus-linux-package-builder
    hostname: asdatarius-package-management
    volumes:
      - ./:/workspace:rw
      - rpmbuild:/root/rpmbuild
      - repo:/var/www/repo
    working_dir: /workspace
    command: tail -f /dev/null

  # Nginx server to host the custom repository
  repo-server:
    image: nginx:alpine
    container_name: otus-linux-repo-server
    volumes:
      - repo:/usr/share/nginx/html/repo:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - builder

volumes:
  rpmbuild:
    name: otus-rpmbuild
  repo:
    name: otus-repo
