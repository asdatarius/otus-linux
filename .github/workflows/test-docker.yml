name: Test Docker Setups

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homework:
          - 02-raid
          - 03-lvm
          - 04-bash
          - 05-proc
          - 07-systemd
          - 08-package_management

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build ${{ matrix.homework }} image
        run: |
          cd ${{ matrix.homework }}
          docker compose build

      - name: Test ${{ matrix.homework }} startup
        run: |
          cd ${{ matrix.homework }}
          docker compose up -d
          sleep 5
          docker compose ps
          docker compose down -v

  test-05-proc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Test 05-proc scripts
        run: |
          cd 05-proc
          docker compose up -d
          sleep 3

          # Test ps script
          docker compose exec -T proc bash ./asdatarius_ps_ax.sh | head -10

          # Test lsof script
          docker compose exec -T proc bash ./asdatarius_lsof.sh | head -20

          docker compose down -v

  summary:
    runs-on: ubuntu-latest
    needs: [test-builds, test-05-proc]
    if: always()
    steps:
      - name: Migration Summary
        run: |
          echo "# Docker Migration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Docker configurations tested successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Migrated Homeworks" >> $GITHUB_STEP_SUMMARY
          echo "- 02-raid: RAID with loop devices" >> $GITHUB_STEP_SUMMARY
          echo "- 03-lvm: LVM with snapshots" >> $GITHUB_STEP_SUMMARY
          echo "- 04-bash: systemd timers" >> $GITHUB_STEP_SUMMARY
          echo "- 05-proc: Process exploration" >> $GITHUB_STEP_SUMMARY
          echo "- 07-systemd: systemd services" >> $GITHUB_STEP_SUMMARY
          echo "- 08-package_management: RPM building" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Not Migrated" >> $GITHUB_STEP_SUMMARY
          echo "- 01-kernel: Vagrant only (requires kernel boot)" >> $GITHUB_STEP_SUMMARY
